# ──────────────────────────────────────────────────────────────────────────────
# German EUDI Wallet (SPRIND sandbox) verifier backend — second trust ecosystem
#
# The app serves multiple ecosystems via named backends (?backend=eu|de). This is the
# German backend instance. It signs request objects with the SPRIND-issued RP Access
# Certificate and attaches the Registration Certificate, so EUDIWalletDE trusts us and
# allows the request.
#
# SINGLE-DOMAIN SETUP (important): the RP Access Certificate's SAN is the APP domain
# (mieudiverifier.mitterbucher.com), so the wallet-facing endpoints must live under that
# same domain. The existing Caddy therefore routes, on mieudiverifier.mitterbucher.com:
#     handle /wallet/*  → reverse_proxy eudi-verifier-backend-de:8080   (wallet-facing)
#     handle            → reverse_proxy mieudiverifier:5050             (app + REST API)
# and the app talks to this backend internally at http://eudi-verifier-backend-de:8080.
#
# App configuration (env on the app service):
#     EUDI_VerifierSettings__Backends__eu:  "https://verifier-backend.eudiw.dev"
#     EUDI_VerifierSettings__Backends__de:  "http://eudi-verifier-backend-de:8080"
#     EUDI_VerifierSettings__MdocOnlyBackends__0: "de"        # request only mso_mdoc PID
#     EUDI_VerifierSettings__IntendedUseIds__de:  "pos-pid-mdoc"  # must match VERIFIER_INTENDEDUSES_0_ID
#
# Secrets come from a local .env file next to this compose (NOT committed):
#     DE_KEYSTORE_PASSWORD=…            # password of certs-de/keystore.p12
#     DE_REGISTRATION_CERTIFICATE=…     # the Registration Certificate (JWS compact serialization)
# and the keystore lives at ./certs-de/keystore.p12 (built from our private key + Access Cert).
#
# Deploy:  docker compose -f docker-compose.de-backend.yml up -d
# ──────────────────────────────────────────────────────────────────────────────
services:
  eudi-verifier-backend-de:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-verifier-endpoint:latest
    container_name: eudi-verifier-backend-de
    restart: unless-stopped
    environment:
      # Wallet-facing public base URL = the APP domain (matches the Access Cert SAN).
      VERIFIER_PUBLICURL: "https://mieudiverifier.mitterbucher.com"

      # x509_san_dns client id — must equal a SAN in the RP Access Certificate.
      VERIFIER_CLIENTIDPREFIX: "x509_san_dns"
      VERIFIER_ORIGINALCLIENTID: "mieudiverifier.mitterbucher.com"

      # RP Access Certificate keystore (our private key + the SPRIND-issued Access Cert).
      VERIFIER_ACCESS_CERTIFICATE_KEYSTORE: "file:///certs/keystore.p12"
      VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_TYPE: "pkcs12"
      VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_PASSWORD: "${DE_KEYSTORE_PASSWORD}"
      VERIFIER_ACCESS_CERTIFICATE_ALIAS: "verifier"
      VERIFIER_ACCESS_CERTIFICATE_PASSWORD: "${DE_KEYSTORE_PASSWORD}"
      VERIFIER_ACCESS_CERTIFICATE_SIGNING_ALGORITHM: "ES256"   # P-256 key

      # Registration Certificate (intended use). The app references it via intended_use_id.
      VERIFIER_INTENDEDUSES_0_ID: "pos-pid-mdoc"
      VERIFIER_INTENDEDUSES_0_DESCRIPTION: "PID (mso_mdoc): family name, given name, date of birth"
      VERIFIER_INTENDEDUSES_0_REGISTRATIONCERTIFICATE: "${DE_REGISTRATION_CERTIFICATE}"

      VERIFIER_RESPONSE_MODE: "DirectPost"
      VERIFIER_REQUESTJWT_EMBED: "ByReference"
      VERIFIER_REQUESTJWT_REQUESTURIMETHOD: "Post"

      # Accept the standard EUDI mso_mdoc PID (what the sandbox wallet presents).
      VERIFIER_ATTESTATIONCLASSIFICATIONS: >-
        {"pid":{"vcts":["urn:eudi:pid:1"],"docTypes":["eu.europa.ec.eudi.pid.1"]},
         "qeaa":{"vcts":[],"docTypes":[]},
         "pubeaa":{"vcts":[],"docTypes":[]},
         "eaa":[{"useCase":"mDL","vcts":[],"docTypes":["org.iso.18013.5.1.mDL"]}]}

      CORS_ORIGINS: "*"
      CORS_METHODS: "*"
      CORS_HEADERS: "*"
      SPRING_PROFILES_ACTIVE: "self-signed"
    volumes:
      - ./certs-de/keystore.p12:/certs/keystore.p12:ro
    networks:
      mipdfsign_default:
        aliases: [eudi-verifier-backend-de]

# Shared reverse-proxy network (the existing Caddy lives here and terminates TLS).
networks:
  mipdfsign_default:
    external: true
