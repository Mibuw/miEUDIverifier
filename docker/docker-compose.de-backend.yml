# ──────────────────────────────────────────────────────────────────────────────
# German EUDI Wallet (SPRIND sandbox) verifier backend — second trust ecosystem
#
# The app serves multiple ecosystems via named backends (?backend=eu|de). This is the
# German backend instance. It signs request objects with the SPRIND-issued RP Access
# Certificate and attaches the Registration Certificate, so EUDIWalletDE trusts us and
# allows the request.
#
# SINGLE-DOMAIN SETUP (important): the RP Access Certificate's SAN is the APP domain
# (mieudiverifier.mitterbucher.com), so the wallet-facing endpoints must live under that
# same domain. The existing Caddy therefore routes, on mieudiverifier.mitterbucher.com:
#     handle /wallet/*  → reverse_proxy eudi-verifier-backend-de:8080   (wallet-facing)
#     handle            → reverse_proxy mieudiverifier:5050             (app + REST API)
# and the app talks to this backend internally at http://eudi-verifier-backend-de:8080.
#
# App configuration (env on the app service):
#     EUDI_VerifierSettings__Backends__eu: "https://verifier-backend.eudiw.dev"
#     EUDI_VerifierSettings__Backends__de: "http://eudi-verifier-backend-de:8080"
#     EUDI_VerifierSettings__IntendedUseIds__de: "pos-pid"   # must match VERIFIER_INTENDEDUSES_0_ID
#     EUDI_VerifierSettings__ResponseModes__de: "direct_post.jwt"
#
#     # Both formats are offered as either/or, so "de" must NOT be in MdocOnlyBackends any more.
#     # The generic EU SD-JWT option is dropped because the certificate does not cover it:
#     EUDI_VerifierSettings__SdJwtVctValuesByBackend__de__0:    ""
#     EUDI_VerifierSettings__GermanPidVctValuesByBackend__de__0: "urn:eudi:pid:de:1"
#
#     # Attributes, in mso_mdoc spelling (SD-JWT gets birthdate / nationalities automatically):
#     EUDI_VerifierSettings__PidClaimsByBackend__de__0: "family_name"
#     EUDI_VerifierSettings__PidClaimsByBackend__de__1: "given_name"
#     EUDI_VerifierSettings__PidClaimsByBackend__de__2: "birth_date"
#     EUDI_VerifierSettings__PidClaimsByBackend__de__3: "place_of_birth"
#     EUDI_VerifierSettings__PidClaimsByBackend__de__4: "nationality"
#     EUDI_VerifierSettings__PidClaimsByBackend__de__5: "issuing_authority"
#     EUDI_VerifierSettings__PidClaimsByBackend__de__6: "issuing_country"
#
# Deploy:  docker compose -f docker-compose.de-backend.yml up -d
# ──────────────────────────────────────────────────────────────────────────────
services:
  eudi-verifier-backend-de:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-verifier-endpoint:latest
    container_name: eudi-verifier-backend-de
    restart: unless-stopped
    environment:
      # Wallet-facing public base URL = the APP domain (matches the Access Cert SAN).
      VERIFIER_PUBLICURL: "https://mieudiverifier.mitterbucher.com"

      # The German EUDI Wallet requires the x509_hash client-id scheme. ORIGINALCLIENTID must be the
      # base64url SHA-256 of the Access Certificate (DER), NOT the hostname. Compute with:
      #   openssl x509 -in cert.crt -outform DER | openssl dgst -sha256 -binary \
      #     | openssl base64 -A | tr '+/' '-_' | tr -d '='
      VERIFIER_CLIENTIDPREFIX: "x509_hash"
      # Hash of the Access Certificate issued 2026-07-28 (serial c47fa906…bd93). Recompute on renewal.
      VERIFIER_ORIGINALCLIENTID: "t96yaT8i5o1oL9OXznzyzjETzSjDyhKuUHft7RVkik4"

      # RP Access Certificate keystore (our private key + the SPRIND-issued Access Cert).
      VERIFIER_ACCESS_CERTIFICATE_KEYSTORE: "file:///certs/keystore.p12"
      VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_TYPE: "pkcs12"
      VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_PASSWORD: "${DE_KEYSTORE_PASSWORD}"
      VERIFIER_ACCESS_CERTIFICATE_ALIAS: "verifier"
      VERIFIER_ACCESS_CERTIFICATE_PASSWORD: "${DE_KEYSTORE_PASSWORD}"
      VERIFIER_ACCESS_CERTIFICATE_SIGNING_ALGORITHM: "ES256"   # P-256 key

      # Registration Certificate (one intended use covering BOTH formats). The certificate's own
      # credentials array lists mso_mdoc (doctype eu.europa.ec.eudi.pid.1) and dc+sd-jwt
      # (vct urn:eudi:pid:de:1), so a single request may offer them as either/or alternatives via
      # DCQL credential_sets — the pattern the German developer guide documents for PID
      # presentations. The backend attaches exactly one certificate per transaction, which is why
      # this must be ONE certificate rather than two.
      #
      # Covered attributes (mso_mdoc spelling; the SD-JWT entry uses birthdate / nationalities):
      #   family_name, given_name, birth_date, place_of_birth, nationality,
      #   issuing_authority, issuing_country
      VERIFIER_INTENDEDUSES_0_ID: "pos-pid"
      VERIFIER_INTENDEDUSES_0_DESCRIPTION: "PID (mso_mdoc + dc+sd-jwt): name, birth date, place of birth, nationality, issuer"
      VERIFIER_INTENDEDUSES_0_REGISTRATIONCERTIFICATE: "${DE_REGISTRATION_CERTIFICATE}"

      VERIFIER_RESPONSE_MODE: "DirectPost"
      VERIFIER_REQUESTJWT_EMBED: "ByReference"
      VERIFIER_REQUESTJWT_REQUESTURIMETHOD: "Post"

      # Accept the standard EUDI mso_mdoc PID (what the sandbox wallet presents).
      VERIFIER_ATTESTATIONCLASSIFICATIONS: >-
        {"pid":{"vcts":["urn:eudi:pid:1"],"docTypes":["eu.europa.ec.eudi.pid.1"]},
         "qeaa":{"vcts":[],"docTypes":[]},
         "pubeaa":{"vcts":[],"docTypes":[]},
         "eaa":[{"useCase":"mDL","vcts":[],"docTypes":["org.iso.18013.5.1.mDL"]}]}

      CORS_ORIGINS: "*"
      CORS_METHODS: "*"
      CORS_HEADERS: "*"
      SPRING_PROFILES_ACTIVE: "self-signed"
    volumes:
      - ./certs-de/keystore.p12:/certs/keystore.p12:ro
    networks:
      mipdfsign_default:
        aliases: [eudi-verifier-backend-de]

# Shared reverse-proxy network (the existing Caddy lives here and terminates TLS).
networks:
  mipdfsign_default:
    external: true
